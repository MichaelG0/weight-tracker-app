<ion-header>
  <ion-toolbar>
    <ion-title>Rate ({{ unit }})</ion-title>
  </ion-toolbar>
</ion-header>

<div class="picker-body">
  <div class="picker">
    <div class="wheel">
      <div class="wheel-highlight"></div>
      <div #wholeCol class="wheel-column whole" (scroll)="onWholeScroll($event)">
        @for (n of wholeOptions; track n) {
          <div class="wheel-item" [class.active]="n === whole()" (click)="selectWhole(n)">{{ n }}</div>
        }
      </div>
    </div>

    <span class="separator">.</span>

    <div class="wheel">
      <div class="wheel-highlight"></div>
      <div #hundredthCol class="wheel-column hundredth" (scroll)="onHundredthScroll($event)">
        @for (label of hundredthOptions; track $index) {
          <div class="wheel-item" [class.active]="$index === hundredth()" (click)="selectHundredth($index)">{{ label }}</div>
        }
      </div>
    </div>

    <p class="unit">{{ unit }}</p>
  </div>

  <ion-buttons>
    <ion-button color="primary" (click)="cancel()">Cancel</ion-button>
    <ion-button color="primary" (click)="confirm()">Done</ion-button>
  </ion-buttons>
</div>
