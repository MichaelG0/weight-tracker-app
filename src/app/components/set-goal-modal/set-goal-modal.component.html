<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEditing ? 'Edit Goal' : 'New Goal' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #goalForm="ngForm" (ngSubmit)="submit()">
    <ion-list lines="none" class="goal-form-list">
      <ion-item>
        <ion-select
          label="Goal Type"
          labelPlacement="stacked"
          name="label"
          [(ngModel)]="formData.label"
          (ionChange)="onGoalTypeChange()"
          required
        >
          <ion-select-option value="weight loss">Weight Loss</ion-select-option>
          <ion-select-option value="weight gain">Weight Gain</ion-select-option>
          <ion-select-option value="maintenance">Maintenance</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input
          type="number"
          inputmode="decimal"
          placeholder="0.0"
          label="Start Weight (kg)"
          labelPlacement="stacked"
          step="0.1"
          name="startWeight"
          [(ngModel)]="formData.startWeight"
          (ngModelChange)="onStartWeightChange()"
          required
          (keydown)="filterKey($event)"
        />
        <ion-button fill="clear" slot="end" class="refresh-btn" (click)="refreshStartWeight()" aria-label="Recalculate average">
          <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item>
        <ion-input
          type="date"
          label="Start Date"
          labelPlacement="stacked"
          name="startDate"
          [(ngModel)]="formData.startDate"
          required
        ></ion-input>
      </ion-item>

      <ion-item [class.input-disabled]="formData.label === 'maintenance'">
        <ion-input
          type="number"
          inputmode="decimal"
          placeholder="0.0"
          label="Target Weight (kg)"
          labelPlacement="stacked"
          step="0.1"
          name="weight"
          [(ngModel)]="formData.weight"
          [readonly]="formData.label === 'maintenance'"
          required
          (keydown)="filterKey($event)"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="date"
          label="End Date"
          labelPlacement="stacked"
          name="endDate"
          [(ngModel)]="formData.endDate"
          required
        ></ion-input>
      </ion-item>
    </ion-list>

    @if (overlapError) {
      <p class="error-msg">{{ overlapError }}</p>
    }

    <ion-button expand="block" shape="round" type="submit" class="submit-btn" [disabled]="!goalForm.valid || !isFormValid">
      {{ isEditing ? 'Update Goal' : 'Add Goal' }}
    </ion-button>
  </form>
</ion-content>
