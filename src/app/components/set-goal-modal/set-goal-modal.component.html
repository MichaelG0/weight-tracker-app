<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEditing ? 'Edit Goal' : 'New Goal' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #goalForm="ngForm" (ngSubmit)="submit()">
    <ion-list lines="none" class="goal-form-list">
      <ion-item>
        <ion-input
          type="number"
          inputmode="decimal"
          placeholder="0.0"
          label="Target Weight (kg)"
          labelPlacement="stacked"
          step="0.1"
          min="1"
          max="1000"
          name="weight"
          [(ngModel)]="formData.weight"
          required
          (keydown)="filterKey($event)"
        ></ion-input>
      </ion-item>
    </ion-list>

    <div class="date-wrap">
      <p class="field-label">Target Date</p>
      <ion-datetime
        presentation="date"
        [(ngModel)]="formData.date"
        name="date"
        [max]="maxDate"
        size="cover"
        showAdjacentDays
      ></ion-datetime>
    </div>

    <ion-list lines="none" class="goal-form-list">
      <ion-item>
        <ion-input
          label="Label (optional)"
          labelPlacement="stacked"
          type="text"
          name="label"
          [(ngModel)]="formData.label"
          maxlength="50"
          placeholder="e.g. Lean bulk target"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button
      expand="block"
      shape="round"
      type="submit"
      class="submit-btn"
      [disabled]="!goalForm.valid || !formData.weight || !formData.date"
    >
      Save
    </ion-button>
  </form>
</ion-content>
