<ion-header>
  <ion-toolbar>
    <ion-title>Weight ({{ unit() }})</ion-title>
  </ion-toolbar>
</ion-header>

<div class="picker-body">
  <app-weight-picker [value]="value"></app-weight-picker>
</div>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="secondary">
      <ion-button color="primary" (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-buttons slot="primary">
      <ion-button color="primary" (click)="confirm()">Done</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
