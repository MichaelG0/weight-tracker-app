<ion-header>
  <ion-toolbar>
    <ion-title>Log Weight</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #logForm="ngForm" (ngSubmit)="save(logForm)" class="log-weight-form">
    <ion-list lines="none" class="log-form-list">
      <ion-item>
        <ion-input
          id="log-date-trigger"
          label="Date"
          labelPlacement="stacked"
          placeholder="Select date"
          [readonly]="true"
          [value]="formData.selectedDate | formatDate: { month: 'short', day: 'numeric', year: 'numeric' }"
        ></ion-input>
        <ion-modal class="date-modal" trigger="log-date-trigger" (ionModalDidPresent)="onDateModalPresented()">
          <ng-template>
            <ion-datetime
              #dateTimePicker
              presentation="date"
              [value]="formData.selectedDate"
              [max]="maxDate"
              [showDefaultButtons]="true"
              (ionChange)="onDateChange($event)"
            ></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>
    </ion-list>

    <div class="weight-wrap">
      <p class="field-label">Weight</p>
      <app-weight-picker [value]="formData.weight" (weightChange)="formData.weight = $event"></app-weight-picker>
    </div>

    <ion-list lines="none" class="log-form-list">
      <ion-item>
        <ion-textarea
          label="Notes (optional)"
          labelPlacement="stacked"
          placeholder="e.g. post-morning, fasted..."
          [(ngModel)]="formData.notes"
          name="notes"
          [rows]="2"
          [autoGrow]="true"
        ></ion-textarea>
      </ion-item>
    </ion-list>

    <ion-button
      type="submit"
      expand="block"
      shape="round"
      color="primary"
      class="submit-btn"
      [disabled]="logForm.invalid || !formData.weight"
    >
      @if (formData.existingEntryId) {
        Update
      } @else {
        Save
      }
    </ion-button>
  </form>
</ion-content>
