<ion-header>
  <ion-toolbar>
    <ion-title>Log Weight</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #logForm="ngForm" (ngSubmit)="save(logForm)" class="log-weight-form">
    <ion-list lines="none" class="log-form-list">
      <ion-item>
        <ion-input
          type="number"
          inputmode="decimal"
          placeholder="0.0"
          label="Weight (kg)"
          labelPlacement="stacked"
          step="0.1"
          min="1"
          max="1000"
          name="weight"
          [(ngModel)]="formData.weight"
          required
          (ionInput)="onWeightInput($event)"
          (keydown)="onWeightKeydown($event)"
        ></ion-input>
      </ion-item>
    </ion-list>

    <div class="date-wrap">
      <p class="field-label">Date</p>
      <ion-datetime
        #dateTimePicker
        presentation="date"
        [class.has-entry]="formData.existingEntryId"
        [(ngModel)]="formData.selectedDate"
        [value]="formData.selectedDate"
        name="selectedDate"
        [max]="maxDate"
        [highlightedDates]="highlightedDates()"
        (ionChange)="onDateChange($event)"
        size="cover"
        showAdjacentDays
      ></ion-datetime>
    </div>

    <ion-list lines="none" class="log-form-list">
      <ion-item>
        <ion-textarea
          label="Notes (optional)"
          labelPlacement="stacked"
          placeholder="e.g. post-morning, fasted..."
          [(ngModel)]="formData.notes"
          name="notes"
          [rows]="2"
          [autoGrow]="true"
        ></ion-textarea>
      </ion-item>
    </ion-list>

    <ion-button type="submit" expand="block" shape="round" color="primary" class="submit-btn" [disabled]="logForm.invalid">
      Save
    </ion-button>
  </form>
</ion-content>
