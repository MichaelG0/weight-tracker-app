<ion-header>
  <ion-toolbar>
    <ion-title>Log Weight</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #logForm="ngForm" (ngSubmit)="save(logForm)">
    <div class="list-group-wrp">
      <section class="list-group">
        <ion-list lines="none">
          <ion-item id="log-date-trigger" class="list-group-item" button detail="false">
            <ion-label>Date</ion-label>
            <span class="detail-value" slot="end">{{
              formData.selectedDate | formatDate: { month: 'short', day: 'numeric', year: 'numeric' }
            }}</span>
            <ion-modal class="date-modal" trigger="log-date-trigger" (ionModalDidPresent)="onDateModalPresented()">
              <ng-template>
                <ion-datetime
                  #dateTimePicker
                  presentation="date"
                  [value]="formData.selectedDate"
                  [max]="maxDate"
                  [showDefaultButtons]="true"
                  (ionChange)="onDateChange($event)"
                ></ion-datetime>
              </ng-template>
            </ion-modal>
          </ion-item>
        </ion-list>
      </section>

      <section class="list-group list-group__weight-group">
        <div class="list-group-label">
          <span>Weight</span>
        </div>
        <app-weight-picker [value]="formData.weight" (weightChange)="formData.weight = $event"></app-weight-picker>
      </section>

      <section class="list-group">
        <ion-list lines="none">
          <ion-item class="list-group-item">
            <ion-textarea
              label="Notes (optional)"
              labelPlacement="stacked"
              placeholder="e.g. post-morning, fasted..."
              [(ngModel)]="formData.notes"
              name="notes"
              [rows]="2"
              [autoGrow]="true"
            ></ion-textarea>
          </ion-item>
        </ion-list>
      </section>
    </div>

    <ion-button
      type="submit"
      expand="block"
      shape="round"
      color="primary"
      class="submit-btn"
      [disabled]="logForm.invalid || !formData.weight"
    >
      @if (formData.existingEntryId) {
        Update
      } @else {
        Save
      }
    </ion-button>
  </form>
</ion-content>
