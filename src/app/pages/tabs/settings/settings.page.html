<ion-header appGlassBackdrop>
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="tab-content">
  <div class="list-group-wrp">
    <section class="list-group personal-details-list-group">
      <p class="list-group-label">Personal Details</p>
      <ion-list lines="none">
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="person-outline"></ion-icon>
          </div>
          <ion-input
            label="Name"
            labelPlacement="stacked"
            placeholder="Enter your name"
            [(ngModel)]="name"
            (ionBlur)="saveSettings()"
          ></ion-input>
        </ion-item>
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="male-female-outline"></ion-icon>
          </div>
          <ion-label>Sex</ion-label>
          <div class="chip-group" slot="end">
            <ion-chip [class.selected]="gender === 'Male'" (click)="setGender('Male')">Male</ion-chip>
            <ion-chip [class.selected]="gender === 'Female'" (click)="setGender('Female')">Female</ion-chip>
          </div>
        </ion-item>
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="calendar-outline"></ion-icon>
          </div>
          <ion-input
            label="Age"
            labelPlacement="stacked"
            type="number"
            placeholder="Years"
            [(ngModel)]="age"
            (ionBlur)="saveSettings()"
          ></ion-input>
        </ion-item>
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="resize-outline"></ion-icon>
          </div>
          @if (heightUnit === 'ft/in') {
            <div class="ft-in-group">
              <ion-input
                label="Height (ft)"
                labelPlacement="stacked"
                type="number"
                placeholder="ft"
                [(ngModel)]="heightFt"
                (ionBlur)="saveSettings()"
              ></ion-input>
              <ion-input
                label="(in)"
                labelPlacement="stacked"
                type="number"
                placeholder="in"
                [(ngModel)]="heightIn"
                (ionBlur)="saveSettings()"
              ></ion-input>
            </div>
          } @else {
            <ion-input
              label="Height (cm)"
              labelPlacement="stacked"
              type="number"
              placeholder="cm"
              [(ngModel)]="heightCm"
              (ionBlur)="saveSettings()"
            ></ion-input>
          }
        </ion-item>
      </ion-list>
    </section>

    <section class="list-group units-list-group">
      <p class="list-group-label">Units</p>
      <ion-list lines="none">
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="barbell-outline"></ion-icon>
          </div>
          <ion-label>Weight</ion-label>
          <div class="chip-group" slot="end">
            <ion-chip [class.selected]="weightUnit === 'kg'" (click)="setWeightUnit('kg')">kg</ion-chip>
            <ion-chip [class.selected]="weightUnit === 'lbs'" (click)="setWeightUnit('lbs')">lbs</ion-chip>
            <ion-chip [class.selected]="weightUnit === 'st'" (click)="setWeightUnit('st')">st</ion-chip>
          </div>
        </ion-item>
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="body-outline"></ion-icon>
          </div>
          <ion-label>Height</ion-label>
          <div class="chip-group" slot="end">
            <ion-chip [class.selected]="heightUnit === 'cm'" (click)="setHeightUnit('cm')">cm</ion-chip>
            <ion-chip [class.selected]="heightUnit === 'ft/in'" (click)="setHeightUnit('ft/in')">ft/in</ion-chip>
          </div>
        </ion-item>
      </ion-list>
    </section>

    <section class="list-group">
      <p class="list-group-label">Appearance</p>
      <ion-list lines="none">
        <ion-item class="list-group-item">
          <div class="icon-wrap" slot="start">
            <ion-icon name="moon-outline"></ion-icon>
          </div>
          <ion-toggle [checked]="isDarkMode()" (ionChange)="toggleTheme($event)"> Dark Mode </ion-toggle>
        </ion-item>
      </ion-list>
    </section>
  </div>
</ion-content>
